{% extends 'app/layout.html' %}

{% block content %}
<h1>Контакти</h1>

<div class="contacts-grid">
    <div>
        <h2>Офіс у Києві</h2>
        <p>вул. Хрещатик, 10</p>
        <p>Телефон: +380 (44) 123-45-67</p>
        <p>Email: info@techvision.com</p>
    </div>

        <h2>Зворотній звʼязок</h2>

        </form>

</div>
{% endblock %}
